<!DOCTYPE html>
<html>
<head><title>Upload Result</title>
<style>body{font-family:Arial;max-width:600px;margin:20px auto;padding:20px}.success{color:green;background:#e8f5e9;padding:10px;margin:5px 0;border-radius:3px}.error{color:red;background:#ffebee;padding:10px;margin:5px 0;border-radius:3px}.btn{display:inline-block;background:#007bff;color:#fff;padding:10px;text-decoration:none;margin-top:20px}</style>
</head>
<body>
<h2>Upload Result</h2>
{% for platform, result in results.items() %}
<div class="{% if '✅' in result %}success{% else %}error{% endif %}">
<strong>{{ platform }}:</strong> {{ result }}
</div>
{% endfor %}
<a href="{{ url_for('post') }}" class="btn">Upload Another Video</a>
<a href="{{ url_for('dashboard') }}" class="btn">Dashboard</a>
</body>
</html>
