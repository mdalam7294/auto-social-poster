<!DOCTYPE html>
<html>
<head><title>Dashboard</title>
<style>body{font-family:Arial;max-width:800px;margin:20px auto;padding:20px}.card{border:1px solid #ddd;padding:15px;margin:15px 0;border-radius:5px}.btn{display:inline-block;padding:8px 15px;margin:5px;text-decoration:none;border-radius:3px}.btn-primary{background:#007bff;color:#fff}.btn-info{background:#17a2b8;color:#fff}.connected{color:green}.not-connected{color:red}</style>
</head>
<body>
<h1>Welcome, {{ current_user.username }}!</h1>
<a href="{{ url_for('logout') }}" style="float:right;">Logout</a>
<div class="card">
<h3>Quick Actions</h3>
<a href="{{ url_for('post') }}" class="btn btn-primary">🎥 Upload Video to YouTube</a>
</div>
<div class="card">
<h3>YouTube Connection</h3>
{% if current_user.youtube_token %}
<span class="connected">✅ Connected</span>
{% else %}
<span class="not-connected">❌ Not Connected</span>
<a href="{{ url_for('connect_youtube') }}" class="btn btn-info">Connect YouTube</a>
{% endif %}
</div>
</body>
</html>
