<!DOCTYPE html>
<html>
<head><title>Upload Video</title>
<style>body{font-family:Arial;max-width:600px;margin:20px auto;padding:20px}input,textarea,select{width:100%;padding:8px;margin:10px 0}.btn{background:#007bff;color:#fff;padding:10px;border:none;width:100%;cursor:pointer}</style>
</head>
<body>
<h2>Upload Video to YouTube</h2>
<form method="post" enctype="multipart/form-data">
<label>Video File:</label>
<input type="file" name="media" accept="video/*" required>
<label>Title:</label>
<input type="text" name="title" placeholder="Enter video title">
<label>Description / Caption:</label>
<textarea name="caption" rows="4" required></textarea>
<label>Tags (comma separated):</label>
<input type="text" name="tags" placeholder="tech, review, viral">
<label>Privacy:</label>
<select name="privacy">
<option value="public">Public</option>
<option value="unlisted">Unlisted</option>
<option value="private">Private</option>
</select>
<button type="submit" class="btn">Upload to YouTube</button>
</form>
<p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
</body>
</html>
